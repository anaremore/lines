# Release artifacts (docs/release.md). Pushing a tag `v*` builds the public app (no vendor
# features) in the release profile on Windows, macOS and Linux and attaches the packages plus
# SHA-256 checksums to a DRAFT pre-release. The orchestrator writes the notes and publishes it.
# Signing and notarization stay with the owner: nothing here uses a signing identity.
#
# The tag must match the workspace version (`v0.2.0` for 0.2.0). Workflow test tags may add
# `-ci.N` (`v0.2.0-ci.1`); delete those tags and their drafts after testing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  version:
    name: check tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - id: v
        run: |
          tag_version="${TAG#v}"
          base="${tag_version%%-ci.*}"   # workflow test tags only
          workspace=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lines-app") | .version')
          echo "tag $TAG -> $tag_version; workspace version $workspace"
          if [ "$base" != "$workspace" ]; then
            echo "::error::tag $TAG does not match the workspace version $workspace (expected v$workspace)"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  licenses:
    name: third-party licence notices
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.3
      - name: Generate THIRD_PARTY_LICENSES.txt
        # Config about.toml, template .github/release/about.hbs. Fails if a dependency's licence
        # is not on the accepted list.
        run: |
          cargo about generate --locked --fail -c about.toml             -o THIRD_PARTY_LICENSES.txt .github/release/about.hbs
          wc -c THIRD_PARTY_LICENSES.txt
          head -40 THIRD_PARTY_LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.name }})
    needs: [version, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PKG: lines-${{ github.ref_name }}-${{ matrix.name }}
      # Whether the owner's update-signing key is set (secrets can't be tested in `if:`).
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install GPUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan1 libglib2.0-dev libzstd-dev libasound2-dev

      - name: Install pinned toolchain
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses

      - name: Build (public, release profile)
        # Default features only: never `vendor-cqg` in a release (docs/release.md).
        run: cargo build --release --locked -p lines-app

      # ---- macOS: text must render (gpui_macos needs its `font-kit` feature) -------------
      - name: "macOS gate: headless run logs no text warning"
        if: runner.os == 'macOS'
        run: |
          ./target/release/lines --source mock --headless 2 >headless.out 2>headless.err || true
          cat headless.err
          if grep -q "no text will be rendered" headless.err; then
            echo "::error::lines logged 'no text will be rendered' (gpui_macos built without font-kit)"
            exit 1
          fi
      - name: "macOS gate: gpui_macos built with font-kit"
        # --headless never creates the GPUI platform, so the step above cannot see the warning.
        # This checks the build itself.
        if: runner.os == 'macOS'
        run: |
          cargo tree --locked -p lines-app -e features -i gpui_macos --target aarch64-apple-darwin >features.txt
          if ! grep -q 'gpui_macos feature "font-kit"' features.txt; then
            echo "::error::gpui_macos is built without its font-kit feature: macOS would render no text"
            exit 1
          fi
      - name: "macOS gate: windowed run logs no text warning"
        # A real window for a few seconds; GPUI's `log` warning reaches stderr through
        # tracing-subscriber's log bridge.
        if: runner.os == 'macOS'
        run: |
          ./target/release/lines --source mock >window.out 2>window.err &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "app still running after 8 s (window up)"
          else
            echo "::warning::app exited within 8 s; this check saw only its startup"
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat window.err
          if grep -q "no text will be rendered" window.err; then
            echo "::error::lines logged 'no text will be rendered' (gpui_macos built without font-kit)"
            exit 1
          fi

      # ---- packaging ----------------------------------------------------------------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/$env:PKG, out | Out-Null
          Copy-Item target/release/lines.exe, LICENSE.md, THIRD_PARTY_LICENSES.txt dist/$env:PKG/
          (Get-Content .github/release/README-windows.txt -Raw).Replace('@VERSION@', $env:VERSION) |
            Set-Content -NoNewline dist/$env:PKG/README.txt
          # Flat zip: lines.exe, LICENSE.md, README.txt at the top level.
          Compress-Archive -Path dist/$env:PKG/* -DestinationPath "out/$env:PKG.zip"

      # In-app updates (decision 0031): the bare executable, its minisign signature (trusted
      # comment `lines <version> public pre-release <target>`) and `update.json`, for the app's
      # updater. Only when the owner's signing key is a repository secret; without it the
      # release is as before and no build updates itself.
      - name: Sign the update (Windows)
        if: runner.os == 'Windows' && env.HAS_UPDATE_KEY == 'true'
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $name = "lines-$target.exe"
          Copy-Item target/release/lines.exe "out/$name"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name"
          cargo run --locked --release -p lines-app --example sign_update -- "out/$name" $env:VERSION $target $url out

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          root="dist/$PKG"
          app="$root/Lines.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" out
          cp target/release/lines "$app/Contents/MacOS/lines"
          cp target/release/lines LICENSE.md THIRD_PARTY_LICENSES.txt "$root/"
          sed "s/@VERSION@/$VERSION/g" .github/release/Info.plist >"$app/Contents/Info.plist"
          sed "s/@VERSION@/$VERSION/g" .github/release/README-macos.txt >"$root/README.txt"
          plutil -lint "$app/Contents/Info.plist"
          # .icns from the committed PNGs.
          set_dir=$(mktemp -d)/lines.iconset
          mkdir -p "$set_dir"
          png=assets/icon/png
          for s in 16 32 128 256 512; do
            cp "$png/lines-$s.png" "$set_dir/icon_${s}x${s}.png"
            cp "$png/lines-$((s * 2)).png" "$set_dir/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$set_dir" -o "$app/Contents/Resources/lines.icns"
          # Ad-hoc signature only (no identity, not notarized): without it Apple silicon reports
          # a downloaded bundle as "damaged" instead of offering right-click > Open.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          # ditto keeps permissions, symlinks and extended attributes.
          ditto -c -k --sequesterRsrc --keepParent "$root" "out/$PKG.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          root="dist/$PKG"
          mkdir -p "$root" out
          cp target/release/lines LICENSE.md THIRD_PARTY_LICENSES.txt "$root/"
          sed "s/@VERSION@/$VERSION/g" .github/release/README-linux.txt >"$root/README.txt"
          tar -C dist -czf "out/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * >SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --verify-tag \
              --title "Lines $TAG" \
              --notes "Draft: release notes to be written before publishing (docs/release.md)."
          fi
          gh release upload "$TAG" dist/* --clobber
