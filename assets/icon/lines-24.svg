  <rect x="11" y="5" width="8" height="2" fill="#ECEAF4" fill-opacity="0.45"/>
  <rect x="8" y="8" width="11" height="2" fill="#ECEAF4" fill-opacity="0.7"/>
  <rect x="5" y="11" width="14" height="2" fill="#8C7BFF"/>
  <rect x="5" y="14" width="11" height="2" fill="#ECEAF4" fill-opacity="0.7"/>
  <rect x="5" y="17" width="8" height="2" fill="#ECEAF4" fill-opacity="0.45"/>
</svg>
