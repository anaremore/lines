# cargo-about config: generates THIRD_PARTY_LICENSES for every release artifact
# (.github/workflows/release.yml, template .github/release/about.hbs). Keep `accepted` in step
# with deny.toml's [licenses] allow-list; CI's cargo-deny is the gate, this is the notice file.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
# The shipped platforms only.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# Release builds use default features; dev-only and build-only crates are not distributed.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Our own crates (FSL, see LICENSE.md) are not third-party.
private = { ignore = true }

# Crate-scoped acceptance, mirroring deny.toml's exception (Mozilla CA root data).
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

# Mirrors deny.toml: via `dbn` (lines-databento, decision 0033); a public-domain dedication.
[json-writer]
accepted = ["Unlicense"]
