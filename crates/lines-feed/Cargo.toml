[package]
name = "lines-feed"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Real CQG WebAPI connection (WSS logon to CQG's servers). Off by default: public builds ship
# only mock, replay, Coinbase public data and paper (decision 0014, docs/release.md). The CQG
# protocol session, the in-process mock and cqg-proto stay in every build so the mock and
# replays of CQG-format recordings work.
vendor-cqg = []
# A synthetic level source (`levels::demo`) for screenshots of the levels layer. Never
# registered unless asked for (`--levels demo`).
demo-levels = []

[dependencies]
lines-core.workspace = true
lines-indicators.workspace = true
cqg-proto.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
futures-util.workspace = true
bytes.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
# Paused tokio time: replay pacing tests run on a manual clock, never real sleeps.
tokio = { workspace = true, features = ["test-util"] }
