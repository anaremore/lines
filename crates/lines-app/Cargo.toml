[package]
name = "lines-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lines"
path = "src/main.rs"

[features]
# Real CQG connection (`--source cqg`); off by default (decision 0014, docs/release.md).
vendor-cqg = ["lines-feed/vendor-cqg"]
# Reproducible --screenshot mode (decision 0009). Off by default because it enables GPUI's
# `test-support` feature (that is where `Window::render_to_image` lives), which pulls in
# test-only dependencies that release builds should not ship.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
# macOS without full Xcode: compile GPUI's Metal shaders at startup instead of at build time
# (`xcrun metal` ships only with Xcode). Build-time shaders stay the default: faster startup.
runtime-shaders = ["gpui_platform/runtime_shaders"]
# The synthetic level source (`--demo-levels`), for screenshots of the levels layer.
demo-levels = ["lines-feed/demo-levels"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
lines-core.workspace = true
lines-feed.workspace = true
lines-indicators.workspace = true
lines-trading.workspace = true
lines-strategy.workspace = true
# Databento (decision 0033): a built-in source on the user's own key (`live`: the gateway).
lines-databento = { workspace = true, features = ["live"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# In-app updates (decision 0031): the release feed over HTTPS, SHA-256 and minisign checks.
ureq.workspace = true
sha2 = "0.10"
minisign-verify = "0.2"
# Symbol picker fuzzy matching (Helix's matcher). MPL-2.0, used unmodified.
nucleo-matcher = "0.3.1"
# Same major as GPUI's `image` so `RgbaImage` is one type. PNG only: decodes the window icon
# (X11) and encodes screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# Diagnostics bundles (zip): deflate and CRC-32. Both already in the tree through `image`.
flate2 = "1.1"
crc32fast = "1.5"

# Without `font-kit`, GPUI on macOS uses a no-op text system and renders no text at all.
# Target-specific so no macOS build can leave it out; guarded by `tests/text_system.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
# The OS keychain for sources' secrets (decision 0030 §4): MIT/Apache, the platform's own
# store on each OS (Windows Credential Manager, macOS Keychain, the Secret Service on Linux).
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust D-Bus (zbus), no libdbus to install.
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[[test]]
name = "text_system"
# Runs on the main thread (GPUI's macOS platform requires it), so no libtest harness.
harness = false

[[test]]
name = "screenshot_exit"
required-features = ["screenshot"]

[[test]]
name = "gallery"
required-features = ["screenshot"]

[build-dependencies]
# Windows icon + version resources. Pinned to the version GPUI already uses for its manifest.
embed-resource = "=3.0.12"

[dev-dependencies]
# Tests sign synthetic updates with a key generated at run time (never stored).
minisign = "0.7"
futures-util.workspace = true
tokio.workspace = true
# Tests use the synthetic level source.
lines-feed = { workspace = true, features = ["demo-levels"] }
