[package]
name = "lines-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lines"
path = "src/main.rs"

[features]
# Real CQG connection (`--source cqg`); off by default (decision 0014, docs/release.md).
vendor-cqg = ["lines-feed/vendor-cqg"]
# Reproducible --screenshot mode (decision 0009). Off by default because it enables GPUI's
# `test-support` feature (that is where `Window::render_to_image` lives), which pulls in
# test-only dependencies that release builds should not ship.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
lines-core.workspace = true
lines-feed.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# Symbol picker fuzzy matching (Helix's matcher). MPL-2.0, used unmodified.
nucleo-matcher = "0.3.1"
# Same major as GPUI's `image` so `RgbaImage` is one type. PNG only: decodes the window icon
# (X11) and encodes screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Windows icon + version resources. Pinned to the version GPUI already uses for its manifest.
embed-resource = "=3.0.12"
